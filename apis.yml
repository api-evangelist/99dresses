name: 99Dresses
description: 99Dresses was a fashion resale and clothing-swap marketplace ("infinite closet") founded
  by Nikki Durkin, which went through Y Combinator and operated from roughly 2011 to June 2014 before
  shutting down. It offered a consumer web and mobile app for trading second-hand designer clothing;
  it never exposed a public developer API, SDK, or documentation surface. As of 2026 the 99dresses.com
  domain resolves to a "Launching Soon" parked placeholder with no live product or developer content.
  This profile was surfaced as a portfolio lead and enriched by the API Evangelist pipeline; no real
  API artifacts exist to harvest because the company is defunct.
